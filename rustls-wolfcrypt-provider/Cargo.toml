[package]
name = "rustls-wolfcrypt-provider"
version = "0.1.0"
edition = "2021"

[dependencies]
rustls = { version = "0.23.22", default-features = false, features = ["tls12"] }
pkcs8 = { version = "0.10.2", default-features = false }
rustls-pki-types = { version = "1.11.0", default-features = false }
signature = { version = "2", default-features = false }
wolfssl-wolfcrypt = { path = "../../../WORK/wolfssl/wrapper/rust/wolfssl-wolfcrypt", features = [
    "aead",
    "digest",
    "signature",
] }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }


[dev-dependencies]
rcgen = { version = "0.13" }
serial_test = { version = "3.2.0", default-features = false }
tokio = { version = "1.43", features = ["macros", "rt", "net", "io-util", "io-std"], default-features = false }
webpki-roots = { version = "0.26", default-features = false }
rustls = { version = "0.23.22", features = ["std", "tls12"] }
rustls-pemfile = { version = "2.2.0", default-features = false, features = ["std"]}
der = { version = "0.7", features = ["alloc"] }
pkcs1 = { version = "0.7", default-features = false, features = ["alloc", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pkcs5"] }
sec1 = { version = "0.7", default-features = false, features = ["alloc", "der"] }
# Test utilities (only used in tests/ and #[cfg(test)] modules)
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = "0.4.1"
wycheproof = { version = "0.6.0", default-features = false, features = ["aead", "hkdf"] }
rayon = "1.10.0"
anyhow = "1.0.95"
num_cpus = "1.16.0"
lazy_static = "1.5.0"
env_logger = { version = "0.11.6", default-features = false }

[features]
default = []
std = ["pkcs8/std", "rustls/std"]

[lints.rust]
# ed25519 is a custom cfg emitted by wolfssl-wolfcrypt's build.rs when the
# wolfSSL library was compiled with --enable-ed25519.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ed25519)'] }

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
